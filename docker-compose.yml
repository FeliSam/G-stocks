version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: gstock
    ports:
      - "5432:5432"
    volumes:
      - gstock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gstock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gstock_pgdata:
